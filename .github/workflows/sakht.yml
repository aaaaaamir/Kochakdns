name: Prepare Codespace Environment

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Force Generate Gradle Wrapper & Codespace DevContainer
        run: |
          # تولید و جایگزینی اجباری فایل‌های گرادل رپر
          gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew

          # ساخت پوشه و تنظیمات کامل Codespace جهت نصب خودکار SDK
          mkdir -p .devcontainer
          cat << 'EOF' > .devcontainer/devcontainer.json
          {
            "name": "Android Dev Environment",
            "image": "mcr.microsoft.com/devcontainers/java:17-bullseye",
            "features": {
              "ghcr.io/devcontainers/features/android-sdk:1": {
                "version": "latest"
              }
            },
            "postCreateCommand": "chmod +x ./gradlew"
          }
          EOF

      - name: Commit and Push Prepared Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update gradle wrapper and devcontainer setup for codespaces"
          file_pattern: "gradlew gradlew.bat gradle/wrapper/* .devcontainer/devcontainer.json"

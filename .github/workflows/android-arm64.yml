name: Build Android ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # تنظیم جاوا ۱۷ برای سازگاری کامل با گریدل و پروژه اندروید
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 25.2.9519653

      # نصب و تنظیم خودکار گریدل ۸.۴ (بدون نیاز به gradlew در ریپازیتوری)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # اجرای مستقیم دستور gradle
      - name: Build release APK for ARM64
        run: |
          gradle clean assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kochakdns-arm64-apk
          path: app/build/outputs/apk/release/app-release.apk

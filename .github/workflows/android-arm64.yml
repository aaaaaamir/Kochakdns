name: Build Android ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # تنظیم جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # نصب گرادل و فعال‌سازی خلاصه گزارش خطاهای بیلد
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          add-job-summary: 'always'

      # بررسی وجود gradlew و ساخت خودکار آن در صورت عدم وجود
      - name: Ensure gradlew exists and make executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found! Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      # بررسی دقیق باگ‌ها و کدهای نادرست (Android Lint)
      - name: Run Android Lint
        run: |
          ./gradlew lintDebug --stacktrace --warning-mode=all
        continue-on-error: true

      # اجرای بیلد با چاپ کامل جزییات استک‌تریس و خطاها
      - name: Build Debug APK for ARM64
        run: |
          ./gradlew assembleDebug --build-cache --stacktrace --warning-mode=all

      # آپلود فایل APK در صورت موفقیت
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kochakdns-arm64-apk
          path: app/build/outputs/apk/debug/*.apk

      # آپلود گزارش متنی و HTML کامل باگ‌ها و خطاهای کامپایل (حتی موقع شکست بیلد)
      - name: Upload Error & Bug Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-and-lint-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/


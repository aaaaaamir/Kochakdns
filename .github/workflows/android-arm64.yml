name: Build Android ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          add-job-summary: 'always'

      - name: Ensure gradlew exists and make executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found! Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Build Debug APK for ARM64
        run: |
          ./gradlew assembleDebug --build-cache --stacktrace --warning-mode=all

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kochakdns-arm64-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Error Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore

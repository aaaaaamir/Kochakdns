name: Build Android ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # تنظیم جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # نصب و تنظیم خودکار گریدل ۸.۴
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # اجرای دستور بیلد (نسخه Debug امضاشده و آماده نصب روی گوشی)
      - name: Build Debug APK for ARM64
        run: |
          gradle clean assembleDebug

      # آپلود فایل APK خروجی جهت دانلود از Artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kochakdns-arm64-apk
          path: app/build/outputs/apk/debug/*.apk

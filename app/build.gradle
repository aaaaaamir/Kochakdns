plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.kochakdns'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.kochakdns'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localProperties.load(new FileInputStream(localPropertiesFile))
            }

            storeFile file("${rootDir}/release.keystore")
            keyAlias 'my-key-alias'
            storePassword localProperties.getProperty('keystorePassword', '')
            keyPassword localProperties.getProperty('keystorePassword', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        // ===== Jetpack Compose =====
        compose true
    }

    // ===== کامپایلر Compose — هماهنگ با Kotlin 1.8.10 (که در build.gradle ریشه است) =====
    // طبق نقشه رسمی: Kotlin 1.8.10 → Compose Compiler 1.4.4 (بالاترین نسخه سازگار)
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.4'
    }
}

dependencies {
    // ========== Core Android ==========
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ========== Coroutines (برای async/await در Kotlin) ==========
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ========== Lifecycle (برای lifecycleScope و viewModelScope) ==========
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    // ========== DataStore (برای ذخیره DNS Config) ==========
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // ========== Fragment ==========
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // ========== Networking (برای DoH و resolve دستی DNS در DnsSyncManager) ==========
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ========== Jetpack Compose (مثل v2rayNG) ==========
    // BOM هم‌دوره با Kotlin 1.8 (Compose 1.5.4) برای جلوگیری از ناسازگاری metadata
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ========== Testing ==========
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.6'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

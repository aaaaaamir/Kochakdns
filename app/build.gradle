plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.kochakdns'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.kochakdns'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localProperties.load(new FileInputStream(localPropertiesFile))
            }

            storeFile file("${rootDir}/release.keystore")
            keyAlias 'my-key-alias'
            storePassword localProperties.getProperty('keystorePassword', '')
            keyPassword localProperties.getProperty('keystorePassword', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // ========== Core Android ==========
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ========== RecyclerView (برای ListAdapter و DiffUtil در TunnelAppsActivity) ==========
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ========== Coroutines (برای async/await در Kotlin) ==========
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ========== Lifecycle (برای lifecycleScope و viewModelScope) ==========
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // ========== DataStore (برای ذخیره DNS Config) ==========
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // ========== Fragment (اگر از Fragment استفاده می‌کنید) ==========
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // ========== Networking (برای DoH و resolve دستی DNS در DnsSyncManager) ==========
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ========== Testing ==========
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.6'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
